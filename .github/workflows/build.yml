name: Build HSELL

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda android/ papkasi bo'lmasa, vaqtinchalik loyihadan olib kelamiz
      - name: Android platformasini tayyorlash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org uz.hsell --project-name hsell _tmp_app
            cp -r _tmp_app/android ./android
            rm -rf _tmp_app
          fi

      - name: Paketlarni o'rnatish
        run: flutter pub get

      - name: Kodni tahlil qilish
        run: flutter analyze --no-fatal-infos

      - name: Release APK yig'ish
        run: flutter build apk --release --split-per-abi

      - name: APK ni yuklash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hsell-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # v1.0.0 kabi teg bilan push qilinsa, GitHub Release yaratiladi
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
